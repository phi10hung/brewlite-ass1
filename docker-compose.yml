services:
  # Database PostgreSQL – dùng khi code hằng ngày: docker compose up -d
  db:
    image: postgres:16-alpine
    container_name: brewlite-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Backend + Frontend – chỉ chạy khi bật profile "app" (demo / bàn giao):
  #   docker compose --profile app up --build -d
  backend:
    profiles: ["app"]
    build: ./backend
    container_name: brewlite-backend
    restart: unless-stopped
    environment:
      # Trong mạng Docker, backend gọi database bằng tên dịch vụ "db" (không phải localhost)
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      API_PORT: 4000
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      VNP_TMN_CODE: ${VNP_TMN_CODE}
      VNP_HASH_SECRET: ${VNP_HASH_SECRET}
      VNP_PAY_URL: ${VNP_PAY_URL:-https://sandbox.vnpayment.vn/paymentv2/vpcpay.html}
      VNP_API_URL: ${VNP_API_URL:-https://sandbox.vnpayment.vn/merchant_webapi/api/transaction}
      VNP_RETURN_URL: ${VNP_RETURN_URL:-http://localhost:3000/payment/result}
      ORDER_PAYMENT_MINUTES: ${ORDER_PAYMENT_MINUTES:-5}
    ports:
      - "4000:4000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    profiles: ["app"]
    build:
      context: ./frontend
      args:
        # Trình duyệt trên máy người dùng gọi API qua cổng 4000 của máy
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000}
    container_name: brewlite-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
